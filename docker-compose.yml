# Optional: RabbitMQ only. Run `docker compose up -d` when `RABBITMQ_URL` is set in `.env`.
services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: webhook
      RABBITMQ_DEFAULT_PASS: webhook
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
